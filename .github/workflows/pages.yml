# De website staat sinds 1 november 2026 op Cloudflare Pages (https://wijkvereniging-oosthoek.pages.dev/), die zelf vanuit main bouwt.
# GitHub Pages houdt alleen de oude adressen en gedrukte QR-codes werkend: elke pagina stuurt door naar hetzelfde pad op Cloudflare,
# met zoekdeel en #-route. Daarom draait deze workflow alleen als de doorverwijzing zelf wijzigt: geen tweede kopie van de site.
name: Oude adressen doorverwijzen

on:
  push:
    branches: [main]
    paths:
      - github-pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # Hoofdadres, /sinterklaas/ en elk ander oud pad (via 404.html) krijgen dezelfde doorverwijzing.
      - run: |
          mkdir -p _site/sinterklaas
          cp github-pages/index.html _site/index.html
          cp github-pages/index.html _site/sinterklaas/index.html
          cp github-pages/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
